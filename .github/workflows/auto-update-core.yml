name: Auto-update Core Dependencies

on:
  repository_dispatch:
    types: [sdk-release]

jobs:
  update-deps:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Repo
        uses: ./tools/github/setup-repo

      - name: Update @swapkit/* dependencies
        shell: bash
        run: |
          echo "📦 SDK published new versions:"
          echo '${{ toJson(github.event.client_payload.packages) }}'

          # Update each published package across all workspace package.json files
          for row in $(echo '${{ toJson(github.event.client_payload.packages) }}' | jq -c '.[]'); do
            PKG=$(echo "$row" | jq -r '.name')
            VER=$(echo "$row" | jq -r '.version')

            echo "Updating $PKG to ^$VER"

            # Update dependencies and devDependencies in all packages
            for pkg_json in packages/*/package.json; do
              if jq -e ".dependencies[\"$PKG\"]" "$pkg_json" > /dev/null 2>&1; then
                jq ".dependencies[\"$PKG\"] = \"^$VER\"" "$pkg_json" > tmp.json && mv tmp.json "$pkg_json"
                echo "  ✅ Updated $PKG in $pkg_json (dependencies)"
              fi
              if jq -e ".devDependencies[\"$PKG\"]" "$pkg_json" > /dev/null 2>&1; then
                jq ".devDependencies[\"$PKG\"] = \"^$VER\"" "$pkg_json" > tmp.json && mv tmp.json "$pkg_json"
                echo "  ✅ Updated $PKG in $pkg_json (devDependencies)"
              fi
            done

            # Also sync root package.json deps + overrides. The root pins @swapkit/*
            # in devDependencies; sherif (postinstall lint:ws) fails the whole run if
            # any manifest drifts — versions AND range prefix must match everywhere,
            # hence ^$VER for every dep field (overrides stay exact).
            if jq -e ".dependencies[\"$PKG\"]" package.json > /dev/null 2>&1; then
              jq ".dependencies[\"$PKG\"] = \"^$VER\"" package.json > tmp.json && mv tmp.json package.json
              echo "  ✅ Updated $PKG in root package.json (dependencies)"
            fi
            if jq -e ".devDependencies[\"$PKG\"]" package.json > /dev/null 2>&1; then
              jq ".devDependencies[\"$PKG\"] = \"^$VER\"" package.json > tmp.json && mv tmp.json package.json
              echo "  ✅ Updated $PKG in root package.json (devDependencies)"
            fi
            if jq -e ".overrides[\"$PKG\"]" package.json > /dev/null 2>&1; then
              jq ".overrides[\"$PKG\"] = \"$VER\"" package.json > tmp.json && mv tmp.json package.json
              echo "  ✅ Updated $PKG in root package.json (overrides)"
            fi
          done

      - name: Install updated dependencies
        run: bun install

      - name: Build and verify
        run: bun build:ci

      - name: Lint
        run: bun lint

      - name: Type check
        run: bun type-check:ci

      # Reads each bumped @swapkit/* package's in-package CHANGELOG.md from
      # node_modules (installed above) to describe the real underlying changes.
      - name: Create changeset
        shell: bash
        run: bun run tools/generate-dep-changeset.ts

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update @swapkit/* core dependencies"
          title: "chore: auto-update core dependencies"
          body: |
            ## Auto-update from core repo

            The core repo published new package versions. This PR bumps all `@swapkit/*` dependencies.

            **Updated packages:**
            ```
            ${{ toJson(github.event.client_payload.packages) }}
            ```

            > 🤖 This PR was created automatically by the `sdk-release` dispatch event.
          branch: auto/core-dep-update
          delete-branch: true
          labels: dependencies,automated
