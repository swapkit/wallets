name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - nightly

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Repo
        uses: ./tools/github/setup-repo

      - run: bun build:ci
      - run: bun lint
      - run: bun type-check:ci

  publish:
    needs: [build-lint-test]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write
      pages: write
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Repo
        uses: ./tools/github/setup-repo

      - name: Setup Node with working npm
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Copy npmrc config
        run: cp .npmrc.prod .npmrc

      - name: Set job params
        shell: bash
        run: |
          git config --global user.email "swapkit@users.noreply.github.com"
          git config --global user.name "swapkit"

      - name: Exit pre changeset
        if: github.ref_name == 'nightly'
        continue-on-error: true
        run: bun changeset pre exit

      - name: Change nightly changeset
        if: github.ref_name == 'nightly'
        run: bun changeset version --snapshot nightly

      - name: Create Pull Request or Publish to npm
        id: changesets
        if: github.ref_name == 'develop'
        uses: changesets/action@v1.4.10
        with:
          title: ":tada: Publish Wallets Release"
          version: bun version-bump
          publish: bun publish-packages
          setupGitUser: false
          createGithubReleases: true

      # Only when packages were actually published to npm (not on the Version
      # Packages PR, not on a failed publish). No-op until the secret is set.
      - name: Announce release to Discord
        if: github.ref_name == 'develop' && steps.changesets.outputs.published == 'true'
        continue-on-error: true
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          RELEASE_LABEL: SwapKit Wallets
          EMBED_COLOR: "3066993"
        run: bun run tools/announce-release.ts

      - name: Publish Nightly to npm
        id: nightly
        if: github.ref_name == 'nightly'
        uses: changesets/action@v1.4.10
        with:
          title: ":tada: Publish Wallets Nightly"
          version: bun version-bump
          publish: bun publish-packages --tag nightly --no-git-tag
          setupGitUser: false
          createGithubReleases: false

      # --- Widget deploy artifact (GCP subscribes to the GitHub Release event) ---
      # Only when @swapkit/ui was actually published this run. The GitHub Release
      # is the deploy trigger: prerelease => dev, full release => prod; GCP filters
      # to tags prefixed "@swapkit/ui@", downloads the assets, verifies the
      # manifest sha256, and checks out the release SHA to build the studio.
      - name: Detect @swapkit/ui publish
        id: uipub
        if: steps.changesets.outputs.published == 'true' || steps.nightly.outputs.published == 'true'
        shell: bash
        env:
          LATEST_PKGS: ${{ steps.changesets.outputs.publishedPackages }}
          NIGHTLY_PKGS: ${{ steps.nightly.outputs.publishedPackages }}
        run: |
          if [ "${{ github.ref_name }}" = "develop" ]; then
            PKGS="${LATEST_PKGS:-[]}"; CHANNEL=latest
          else
            PKGS="${NIGHTLY_PKGS:-[]}"; CHANNEL=nightly
          fi
          UIVER=$(echo "$PKGS" | jq -r '.[] | select(.name=="@swapkit/ui") | .version')
          if [ -n "$UIVER" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
            echo "version=$UIVER" >> "$GITHUB_OUTPUT"
            echo "Widget release: @swapkit/ui@$UIVER ($CHANNEL)"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "@swapkit/ui not in this publish — skipping widget release"
          fi

      - name: Build widget artifact
        if: steps.uipub.outputs.ui == 'true'
        env:
          # nightly builds against the dev API; latest against prod
          SWAPKIT_USE_DEV_API: ${{ steps.uipub.outputs.channel == 'nightly' && 'true' || 'false' }}
          CHANNEL: ${{ steps.uipub.outputs.channel }}
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
        run: |
          bun --cwd packages/ui run build:widget
          bun run tools/build-widget-artifact.ts

      - name: Publish widget Release + assets
        if: steps.uipub.outputs.ui == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.uipub.outputs.channel }}
          VERSION: ${{ steps.uipub.outputs.version }}
        run: |
          TAG="@swapkit/ui@${VERSION}"
          ASSETS="packages/ui/dist/widget-${VERSION}.tgz packages/ui/dist/widget-manifest.json"
          if [ "$CHANNEL" = "nightly" ]; then
            # nightly has no changesets release/tag (--no-git-tag) — create a prerelease
            gh release create "$TAG" $ASSETS \
              --prerelease --target "${{ github.sha }}" \
              --title "$TAG" --notes "Widget dev artifact ($VERSION) — deploys to widget-dev.swapkit.dev + cdn-dev."
          else
            # latest: changesets already created the @swapkit/ui@<version> release — attach assets
            gh release upload "$TAG" $ASSETS --clobber
          fi
